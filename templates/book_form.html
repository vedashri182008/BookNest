{% extends "base.html" %}{% block title %}{{ 'Edit' if book else 'Add' }} Book | BookNest{% endblock %}{% block content %}<section class="page-head"><span class="eyebrow">ADMIN</span><h1>{{ 'Edit' if book else 'Add' }} Book</h1></section><section class="section narrow"><form class="form-card two-col" method="post">
<label>Title<input name="title" value="{{ book['title'] if book else '' }}" required></label><label>Author<input name="author" value="{{ book['author'] if book else '' }}" required></label>
<label>Category<input name="category" value="{{ book['category'] if book else '' }}" required></label><label>Price ₹<input type="number" step="0.01" name="price" value="{{ book['price'] if book else '' }}" required></label>
<label>Original Price ₹<input type="number" step="0.01" name="original_price" value="{{ book['original_price'] if book else '' }}" required></label><label>Rating<input type="number" step="0.1" max="5" name="rating" value="{{ book['rating'] if book else 4.5 }}"></label>
<label>Reviews<input type="number" name="review_count" value="{{ book['review_count'] if book else 0 }}"></label><label>Stock<input type="number" name="stock" value="{{ book['stock'] if book else 10 }}"></label>
<label>Publisher<input name="publisher" value="{{ book['publisher'] if book else 'BookNest Publishing' }}"></label><label>Language<input name="language" value="{{ book['language'] if book else 'English' }}"></label>
<label>Pages<input type="number" name="pages" value="{{ book['pages'] if book else 200 }}"></label><label>ISBN<input name="isbn" value="{{ book['isbn'] if book else '' }}"></label>
<label class="span2">Cover Image URL<input name="image" value="{{ book['image'] if book else '' }}" required></label><label class="span2">Description<textarea name="description" rows="5" required>{{ book['description'] if book else '' }}</textarea></label>
<div class="span2"><button class="btn primary">Save Book</button> <a class="btn ghost" href="{{ url_for('admin') }}">Cancel</a></div>
</form></section>{% endblock %}
